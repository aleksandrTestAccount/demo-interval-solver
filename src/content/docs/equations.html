<p class="chunk-paragraph">
  If a line does not contain any equality operators (<code>=</code> or <code>==</code>), then
  <code>== true</code> is implicitly appended to the end:
</p>

<pre data-lang="e0">
a >= 0   // a >= 0 == true
</pre>

<p class="chunk-paragraph">
  Equation sides are completely interchangeable, and the order of equations within the file does not
  matter:
</p>

<pre data-lang="e0">
1 < a
size 8 0
a <= b
247 = a * b
b > 1
</pre>
