<p class="chunk-paragraph">
  You can execute a binary search optimization directly in the engine using the following syntax:
  <code>binarySearch min|max variableName lowerBound upperBound</code>.
</p>

<pre data-lang="e0">
x1 * x2 > 15; 
x1 + x2 = x3; 

x1 >= 0; x2 >= 0; x3 >= 0; 

size 6; 

binarySearch min x3 0 30;
// result: {x3: 8}
</pre>
